name: Build Android Beta

on:
  workflow_dispatch:

concurrency:
  group: android-beta
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build-android-beta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install compatible CMake
        shell: bash
        run: |
          mkdir -p "$HOME/cmake"
          wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz -C "$HOME/cmake"
          echo "cmake.dir=$HOME/cmake/cmake-3.18.1-Linux-x86_64" >> android/local.properties

      - name: Configure Android build
        shell: bash
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          gradle.write_text(
              gradle.read_text().replace(
                  'applicationId = "com.ryan.anymex"',
                  'applicationId = "com.ryan.anymex.beta"',
                  1,
              )
          )

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(
              manifest.read_text().replace(
                  'android:label="AnymeX"',
                  'android:label="AnymeX Beta"',
                  1,
              )
          )

          google_services = Path('android/app/google-services.json')
          config = json.loads(google_services.read_text())
          for client in config['client']:
              client['client_info']['android_client_info']['package_name'] = (
                  'com.ryan.anymex.beta'
              )
          google_services.write_text(json.dumps(config, indent=2) + '\n')
          PY

          cat > .env <<'EOF'
          AL_CLIENT_ID=
          AL_CLIENT_SECRET=
          SIMKL_CLIENT_ID=
          SIMKL_CLIENT_SECRET=
          MAL_CLIENT_ID=
          MAL_CLIENT_SECRET=
          CALLBACK_SCHEME=
          GOOGLE_BOOKS_API_KEY=
          GIT_CLIENT_ID=
          GIT_CLIENT_SECRET=
          GIT_CALLBACK_SCHEME=
          COMMENTS_BASE_URL=
          BOT_BASE_URL=
          BOT_API_SECRET=
          TMDB_API_KEY=
          WATCHIUM_SERVER_URL=
          WATCHIUM_API_TOKEN=
          EOF

          : "${BETA_KEYSTORE_BASE64:?Missing BETA_KEYSTORE_BASE64 secret}"
          : "${BETA_KEYSTORE_PASSWORD:?Missing BETA_KEYSTORE_PASSWORD secret}"
          : "${BETA_KEY_PASSWORD:?Missing BETA_KEY_PASSWORD secret}"

          printf '%s' "$BETA_KEYSTORE_BASE64" \
            | base64 --decode > android/app/anymex-beta.jks

          cat > android/key.properties <<EOF
          storePassword=$BETA_KEYSTORE_PASSWORD
          keyPassword=$BETA_KEY_PASSWORD
          keyAlias=beta
          storeFile=anymex-beta.jks
          EOF

      - name: Build APKs
        id: build
        shell: bash
        run: |
          base_version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          build_number=$((100000 + GITHUB_RUN_NUMBER))
          version_code=$((build_number + 2000))
          build_name="${base_version}-beta.${GITHUB_RUN_NUMBER}"

          echo "number=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$build_name" >> "$GITHUB_OUTPUT"

          flutter pub get
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number "$build_number" \
            --build-name "$build_name"

          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk \
            "AnymeX-Android-Beta-${GITHUB_RUN_NUMBER}-arm64-v8a.apk"

      - name: Verify update identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: a1faa47c315726ed107bc29ab1553365013ae434edc0921e90018efb78bf9941
          EXPECTED_VERSION_CODE: ${{ steps.build.outputs.number }}
          EXPECTED_VERSION_NAME: ${{ steps.build.outputs.name }}
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 \
            -maxdepth 1 -type d | sort -V | tail -n 1)
          aapt="$build_tools/aapt"
          apksigner="$build_tools/apksigner"

          for apk in build/app/outputs/flutter-apk/AnymeX-Android-Beta-*.apk; do
            "$apksigner" verify --verbose "$apk"

            badging=$("$aapt" dump badging "$apk")
            package_line=$(grep -m1 '^package:' <<< "$badging")
            native_code=$(grep -m1 '^native-code:' <<< "$badging")

            cert=$(
              "$apksigner" verify --verbose --print-certs "$apk" 2>&1 \
                | awk -F': ' \
                    '/certificate SHA-256 digest/ {print tolower($NF); exit}'
            )

            echo "APK: $apk"
            echo "$package_line"
            echo "$native_code"
            echo "certificateSha256='$cert'"

            [[ "$package_line" == *"name='com.ryan.anymex.beta'"* ]] || {
              echo '::error::Unexpected Android package name'
              exit 1
            }
            [[ "$package_line" == *"versionCode='$EXPECTED_VERSION_CODE'"* ]] || {
              echo "::error::Expected version code $EXPECTED_VERSION_CODE"
              exit 1
            }
            [[ "$package_line" == *"versionName='$EXPECTED_VERSION_NAME'"* ]] || {
              echo "::error::Expected version name $EXPECTED_VERSION_NAME"
              exit 1
            }
            [[ "$native_code" == "native-code: 'arm64-v8a'" ]] || {
              echo '::error::APK is not ARM64-only'
              exit 1
            }
            [[ "$cert" == "$EXPECTED_CERT_SHA256" ]] || {
              echo '::error::Unexpected signing certificate'
              exit 1
            }
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-beta-${{ github.run_number }}
          retention-days: 14
          path: build/app/outputs/flutter-apk/AnymeX-Android-Beta-*.apk

      - name: Publish beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta-${{ github.run_number }}
          name: Android beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Android test build from fork `main`.

            Package: `com.ryan.anymex.beta`. It installs alongside the official app
            and appears on the launcher as **AnymeX Beta**.

            Version: `${{ steps.build.outputs.name }}`
            Version code: `${{ steps.build.outputs.number }}`

            Beta builds use a persistent signing key and increasing version code,
            so future beta APKs can be installed as in-place updates. Builds 1–4
            used disposable keys and must be uninstalled once.
          files: build/app/outputs/flutter-apk/AnymeX-Android-Beta-*.apk
